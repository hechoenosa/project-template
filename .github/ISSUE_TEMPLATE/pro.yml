name: "🚀 Pro builders: send your idea"
description: "For builders who already code. Send this by Sun 1 Nov. It takes about 10 minutes."
title: "your-project-name-pro"
labels: ["pro"]
body:
  - type: markdown
    attributes:
      value: |
        Send this by **Sun 1 Nov, 8 pm**. You don't need to have built anything yet.

        **Title:** Your project name in lowercase letters and dashes, ending in `-pro`. For example `volt-pro`. We'll create a repo with that name in Hecho en Osa and invite your team. If you're on a team, one person sends this for everyone.
  - type: textarea
    id: team
    attributes:
      label: Who is on your team?
      description: Your GitHub username, and your teammates' if you have any, one per line. To find yours, click your profile picture at the top right of GitHub.
      placeholder: "@your-username"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is your idea?
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for, and what problem does it solve for them?
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Is it new, or did you start it before Hecho en Osa?
      options:
        - It's new, I'm starting now
        - I started it before
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: If you started it before, what works already?
      description: Add a link to the code if you have one. New project? Write "nothing yet".
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: What do you want to build by Thu 10 Dec?
    validations:
      required: true
